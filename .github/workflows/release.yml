name: release

# Pushes to master build too: that saves the Rust cache where tag builds can restore it
# (a cache saved by a tag run is only visible to that tag).
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # tests first: they fail in seconds, the dist build takes minutes
      - run: cargo test --locked
      - run: cargo build --profile dist --locked
      - if: startsWith(github.ref, 'refs/tags/')
        name: package
        run: |
          tar -czf spot-aarch64-apple-darwin.tar.gz -C target/dist spot
          shasum -a 256 spot-aarch64-apple-darwin.tar.gz > spot-aarch64-apple-darwin.tar.gz.sha256
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: spot
          path: spot-aarch64-apple-darwin.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # the notes are the tag's message; checkout leaves that out, so fetch the tag itself
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME has no notes: tag it with git tag -a $GITHUB_REF_NAME --cleanup=verbatim -F notes.md"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "spot $GITHUB_REF_NAME" --notes-from-tag
