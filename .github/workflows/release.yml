name: release

# Pushes to master build too: that saves the Rust cache where tag builds can restore it
# (a cache saved by a tag run is only visible to that tag).
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**.md"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libssl-dev libdbus-1-dev
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: startsWith(github.ref, 'refs/tags/')
        name: package
        run: |
          name=spot-${{ matrix.target }}
          tar -czf $name.tar.gz -C target/${{ matrix.target }}/release spot
          shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: spot-${{ matrix.target }}.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --title "spot $GITHUB_REF_NAME" --generate-notes
