[package]
name = "spot"
version = "2.0.0"
edition = "2024"
description = "Tiny Spotify TUI, with a command line"
repository = "https://github.com/boopdotpng/spot"

[dependencies]
librespot-core = "0.8"
librespot-playback = "0.8"
librespot-oauth = "0.8"
ratatui = "0.30"
unicode-width = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde_json = "1"
librespot-metadata = "0.8"
librespot-protocol = "0.8"
protobuf = "3.7"
souvlaki = "0.8.3"
rand = "0.9"
md-5 = "0.10"
open = "5"
terminal-colorsaurus = "1"
toml = "1.1.8"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# macOS takes media key / Control Center commands on the main thread
[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "0.2"

# Local release builds (install.sh, `cargo build --release`) are incremental: an edit rebuilds in
# seconds rather than minutes. Published builds use the dist profile below.
[profile.release]
opt-level = 3
codegen-units = 16
incremental = true
strip = true

# What the release workflow ships: whole-program optimization, for a smaller, slightly faster
# binary. A full rebuild on every change, a few minutes each: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
incremental = false

# librespot-core 0.8.0 plus a retry for audio keys Spotify refuses at random (vendor/README.md)
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
