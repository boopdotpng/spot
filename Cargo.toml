[package]
name = "spot"
version = "0.1.0"
edition = "2024"
description = "Tiny Spotify TUI"
repository = "https://github.com/boopdotpng/spot"

[dependencies]
librespot-core = "0.8"
librespot-playback = "0.8"
librespot-oauth = "0.8"
ratatui = "0.30"
unicode-width = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde_json = "1"
librespot-metadata = "0.8"
librespot-protocol = "0.8"
protobuf = "3.7"
souvlaki = "0.8.3"
rand = "0.9"
md-5 = "0.10"
open = "5"
terminal-colorsaurus = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
